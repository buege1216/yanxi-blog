# 文章推上來之後，自動用台灣時間（+08:00）寫入 front matter：
#   新增的文章 → date（發布時間）；被修改的文章 → updated（最後編輯時間）
# 這樣不受後台把時間轉成 UTC 的影響。
name: stamp-updated
on:
  push:
    branches: [main]
    paths: ['_posts/**']
permissions:
  contents: write
jobs:
  stamp:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Stamp times (Asia/Taipei)
        run: |
          git diff --name-status HEAD^ HEAD -- '_posts/*.md' > changed.txt || true
          [ -s changed.txt ] || exit 0
          node - <<'JS'
          const fs = require('fs');
          const pad = n => String(n).padStart(2, '0');
          const d = new Date(Date.now() + 8 * 3600 * 1000);
          const now = `${d.getUTCFullYear()}-${pad(d.getUTCMonth()+1)}-${pad(d.getUTCDate())} ` +
                      `${pad(d.getUTCHours())}:${pad(d.getUTCMinutes())}`;
          function setKey(text, key, value, onlyIfEmpty) {
            const m = text.match(/^---\r?\n([\s\S]*?)\r?\n---/);
            if (!m) return text;
            let fm = m[1];
            const re = new RegExp('^' + key + ':.*$', 'm');
            const cur = fm.match(re);
            if (cur) {
              const v = cur[0].slice(key.length + 1).replace(/["'\r]/g, '').trim();
              if (onlyIfEmpty && v) return text;
              fm = fm.replace(re, `${key}: "${value}"`);
            } else {
              fm = fm.replace(/^(title:.*)$/m, `$1\n${key}: "${value}"`);
              if (!fm.includes(key + ':')) fm += `\n${key}: "${value}"`;
            }
            return text.replace(m[1], fm);
          }
          for (const line of fs.readFileSync('changed.txt', 'utf8').split('\n')) {
            const [st, file] = line.split('\t');
            if (!file || !fs.existsSync(file)) continue;
            let t = fs.readFileSync(file, 'utf8');
            if (st === 'A') t = setKey(t, 'date', now, true);
            if (st === 'M') t = setKey(t, 'updated', now, false);
            fs.writeFileSync(file, t);
          }
          JS
          rm -f changed.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Stamp times (Asia/Taipei)"
          git push
